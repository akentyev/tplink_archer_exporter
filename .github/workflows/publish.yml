name: publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push:
        description: publish to ghcr instead of only building
        type: boolean
        default: false

permissions:
  contents: read

# Unlike the tests: a second tag must not cut the first one's publication short.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Dockerfile cross-compiles, so the build emulates nothing: QEMU is
      # for the arm64 half of the smoke step below.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # A dry run never logs in, so it cannot write to the registry at all.
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # metadata-action marks latest only for a semver tag with no prerelease
      # part, so an rc publishes without moving it. The raw tag exists only on a
      # manual run, where the ref is not a tag and the semver rule matches
      # nothing.
      - id: meta
        uses: docker/metadata-action@v6
        # Labels reach the child images only; ghcr reads a multi-arch
        # package's description off the index annotations.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dryrun,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: latest=auto

      - uses: docker/build-push-action@v7
        with:
          # An empty context makes the action build from the git context,
          # cloning the repository again instead of using the checkout.
          context: .
          platforms: linux/amd64,linux/arm64
          # Keeps the attestation manifests, which carry the platform
          # unknown/unknown, out of the index.
          provenance: false
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: check the published tags
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
          # From the ref, not metadata-action: an output cannot check itself.
          EXPECT_LATEST: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
        run: |
          digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"
          }
          # A missing semver tag ends the step: GitHub's shell is bash -e.
          published=$(digest "${IMAGE}:${VERSION}")
          echo "${IMAGE}:${VERSION} is $published"

          # Anchored, or a :latest-foo tag would count as latest.
          if ! printf '%s\n' "$TAGS" | grep -q ':latest$'; then
            if [ "$EXPECT_LATEST" = true ]; then
              echo "a release tag, and no latest among the tags it published"
              exit 1
            fi
            echo "no latest among the tags, so latest is not due to move"
            exit 0
          fi

          moved=$(digest "${IMAGE}:latest")
          if [ "$moved" != "$published" ]; then
            echo "latest is $moved, not the index just published"
            exit 1
          fi
          echo "latest carries the same index"

      # Its own step, or the early return above would skip it on a prerelease.
      - name: check the published index describes itself
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The annotation level is an environment variable: a wrong name
          # there publishes without one and says nothing.
          described=$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" |
            jq -r '.annotations["org.opencontainers.image.description"] // ""')
          if [ -z "$described" ]; then
            echo "the index carries no org.opencontainers.image.description"
            exit 1
          fi
          echo "index description: ${described}"

      - name: run the published image
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          for arch in amd64 arm64; do
            out=$(docker run --rm --pull=always --platform "linux/${arch}" \
                "${IMAGE}:${VERSION}" -version)
            echo "${arch}: ${out}"
            case "$out" in
              "tplink_exporter ${VERSION} (revision ${REVISION},"*) ;;
              *) echo "not what this build should answer"; exit 1 ;;
            esac
          done
