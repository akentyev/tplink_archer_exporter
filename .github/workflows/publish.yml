name: publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push:
        description: publish to ghcr instead of only building
        type: boolean
        default: false

permissions:
  contents: read

# Unlike the tests: a second tag must not cut the first one's publication short.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.push }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-qemu-action is absent by intent: the Dockerfile cross-compiles
      # from the runner's architecture, leaving QEMU nothing to emulate.
      - uses: docker/setup-buildx-action@v4

      # A dry run never logs in, so it cannot write to the registry at all.
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # metadata-action marks latest only for a semver tag with no prerelease
      # part, so an rc publishes without moving it. The raw tag exists only on a
      # manual run, where the ref is not a tag and the semver rule matches
      # nothing.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dryrun,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: latest=auto

      - uses: docker/build-push-action@v7
        with:
          # An empty context makes the action build from the git context,
          # cloning the repository again instead of using the checkout.
          context: .
          platforms: linux/amd64,linux/arm64
          # Keeps the attestation manifests, which carry the platform
          # unknown/unknown, out of the index.
          provenance: false
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - if: env.PUBLISH == 'true'
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
